services:
  - type: web
    name: corgi-memory-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIPESHIFT_API_KEY
        sync: false
      - key: PIPESHIFT_BASE_URL
        sync: false
      - key: PIPESHIFT_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HYDRADB_API_KEY
        sync: false
      - key: THINE_API_KEY
        sync: false

  - type: web
    name: corgi-memory-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://corgi-memory-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
