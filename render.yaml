databases:
  - name: corgi-memory-db
    region: oregon
    plan: free
    databaseName: corgi_memory
    user: corgi_memory_user

services:
  - type: web
    name: corgi-memory-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: corgi-memory-db
          property: connectionString
      - key: PIPESHIFT_API_KEY
        sync: false
      - key: PIPESHIFT_BASE_URL
        sync: false
      - key: PIPESHIFT_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HYDRADB_API_KEY
        sync: false
      - key: HYDRADB_TENANT_ID
        value: corgi-cafe
      - key: HYDRADB_API_URL
        value: https://api.hydradb.com
      - key: THINE_API_KEY
        sync: false

  - type: web
    name: corgi-memory-app
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://corgi-memory-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
